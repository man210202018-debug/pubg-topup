<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شحن ألعاب الموبايل</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-effects">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
        <div class="glow glow-3"></div>
    </div>

    <div class="container">
        <header>
            <div class="hero home-hero">
                <div class="hero-text" style="text-align:center;">
                    <span class="badge">GAME TOP-UP STORE</span>
                    <h1>شحن <span class="highlight">ألعاب</span> الموبايل</h1>
                    <p>اشحن عملاتك الرقمية بسرعة وأمان - أسرع خدمة شحن</p>
                </div>
            </div>
        </header>

        <h2 class="games-title"><span class="section-icon">🎮</span> اختر اللعبة</h2>

        <div class="games-grid">
            <a href="pubg.html" class="game-card">
                <div class="game-card-img">
                    <img src="pubg-icon.png" alt="PUBG">
                </div>
                <div class="game-card-info">
                    <h3>PUBG Mobile</h3>
                    <p>شحن UC</p>
                    <span class="game-card-btn">اشحن الآن →</span>
                </div>
            </a>

            <a href="mlbb.html" class="game-card mlbb">
                <div class="game-card-img">
                    <img src="https://img.icons8.com/color/94/mobile-legends.png" alt="Mobile Legends">
                </div>
                <div class="game-card-info">
                    <h3>Mobile Legends</h3>
                    <p>شحن ماسات</p>
                    <span class="game-card-btn">اشحن الآن →</span>
                </div>
            </a>

            <a href="freefire.html" class="game-card freefire">
                <div class="game-card-img">
                    <img src="https://img.icons8.com/color/94/free-fire.png" alt="Free Fire">
                </div>
                <div class="game-card-info">
                    <h3>Free Fire</h3>
                    <p>شحن جواهر</p>
                    <span class="game-card-btn">اشحن الآن →</span>
                </div>
            </a>
        </div>

        <footer>
            <div class="footer-content">
                <p>هذا موقع تعليمي فقط - جميع الأسعار تقريبية</p>
                <a href="admin.html" class="admin-link">🔒 لوحة التحكم</a>
            </div>
        </footer>
    </div>

    <script>
        document.querySelectorAll('.games-title').forEach(el => {
            el.style.cssText = 'color:#f1f5f9;font-size:1.5rem;font-weight:700;margin:10px 0 20px;display:flex;align-items:center;gap:10px;';
        });
    </script>
</body>
</html>
