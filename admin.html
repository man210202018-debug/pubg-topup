<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - شحن ببجي</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h2>🔒 لوحة التحكم</h2>
            <p>أدخل كلمة المرور للدخول</p>
            <input type="password" id="passwordInput" placeholder="كلمة المرور" maxlength="4">
            <button id="loginBtn">دخول</button>
            <p class="error-msg" id="errorMsg"></p>
        </div>
    </div>

    <div class="container" id="dashboard" style="display:none;">
        <header>
            <h1>📋 لوحة التحكم</h1>
            <p>إدارة طلبات شحن ببجي موبايل</p>
        </header>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalOrders">0</div>
                <div class="stat-label">إجمالي الطلبات</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="newOrders">0</div>
                <div class="stat-label">طلبات جديدة</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalRevenue">$0</div>
                <div class="stat-label">إجمالي الإيرادات</div>
            </div>
        </div>

        <div class="controls">
            <input type="text" id="searchInput" placeholder="بحث بالمعرف...">
            <select id="filterStatus">
                <option value="all">جميع الحالات</option>
                <option value="جديد">جديد</option>
                <option value="قيد التنفيذ">قيد التنفيذ</option>
                <option value="مكتمل">مكتمل</option>
                <option value="ملغي">ملغي</option>
            </select>
            <button id="exportBtn">📥 تصدير CSV</button>
            <button id="clearBtn" class="danger">🗑️ مسح الكل</button>
            <button id="logoutBtn" class="logout">🚪 خروج</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>معرف اللاعب</th>
                        <th>السيرفر</th>
                        <th>الباقة</th>
                        <th>المبلغ</th>
                        <th>طريقة الدفع</th>
                        <th>التاريخ</th>
                        <th>الحالة</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="ordersTable">
                    <tr>
                        <td colspan="9" class="empty">لا توجد طلبات بعد</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <footer>
            <p>لوحة تحكم خاصة بك - لا تشارك الرابط مع أحد</p>
            <a href="index.html" class="back-link">🏠 العودة للموقع</a>
        </footer>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        const ADMIN_PASSWORD = '4444';
        const loginOverlay = document.getElementById('loginOverlay');
        const dashboard = document.getElementById('dashboard');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');
        const logoutBtn = document.getElementById('logoutBtn');

        if (sessionStorage.getItem('adminAuth') === 'true') {
            loginOverlay.style.display = 'none';
            dashboard.style.display = 'block';
        }

        loginBtn.addEventListener('click', () => {
            if (passwordInput.value === ADMIN_PASSWORD) {
                sessionStorage.setItem('adminAuth', 'true');
                loginOverlay.style.display = 'none';
                dashboard.style.display = 'block';
            } else {
                errorMsg.textContent = 'كلمة المرور خاطئة!';
                passwordInput.value = '';
                passwordInput.focus();
            }
        });

        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loginBtn.click();
        });

        logoutBtn.addEventListener('click', () => {
            sessionStorage.removeItem('adminAuth');
            loginOverlay.style.display = 'flex';
            dashboard.style.display = 'none';
            passwordInput.value = '';
            errorMsg.textContent = '';
        });
    </script>
    <script src="admin.js"></script>
</body>
</html>
